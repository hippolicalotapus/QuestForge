name: QuestForge static checks
on:
  push:
    branches: [feature/revenue-ready-storefront]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required site features and safe contact placeholder
        run: python3 scripts/verify_site.py
      - name: Validate inline JavaScript syntax
        run: node --check /tmp/questforge-inline.js
      - name: Install browser test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Run desktop and mobile browser regression checks
        run: python3 scripts/browser_smoke.py
      - name: Upload browser screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: questforge-browser-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
