name: Inkbound Threshold private playtest checks
on:
  push:
    branches:
      - feature/voynich-playtest-readiness-20261113
    paths:
      - development/verify-inkbound-packet.cjs
      - development/verify-inkbound-print-assets.cjs
      - development/verify-inkbound-renders.py
      - development/requirements-render-qa.txt
      - development/RENDER_QA.md
      - development/maps/**
      - development/inkbound-threshold-player-handout-print.html
      - development/inkbound-threshold-dm-quick-sheet-print.html
      - development/voynich-level1-encounter-draft.md
      - development/inkbound-threshold-dm-playtest-packet.md
      - development/inkbound-threshold-player-handout-01.md
      - .github/workflows/inkbound-playtest-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check development/verify-inkbound-packet.cjs
      - run: node --check development/verify-inkbound-print-assets.cjs
      - run: node development/verify-inkbound-packet.cjs
      - run: node development/verify-inkbound-print-assets.cjs

  print-renders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: development/requirements-render-qa.txt
      - name: Install local rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcairo2 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation
          python -m pip install -r development/requirements-render-qa.txt
      - name: Render private playtest maps and handouts
        run: python development/verify-inkbound-renders.py --output-dir "$RUNNER_TEMP/questforge-render-qa"
      - name: Preserve render evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkbound-private-print-renders
          path: ${{ runner.temp }}/questforge-render-qa/*
          if-no-files-found: warn
          retention-days: 3

